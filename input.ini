# bbport input (shadPS4 syntax: output = input, one input per line).
# A shadPS4 input config (user/input_config/CUSA03173.ini) can be copied over this file.
# F7 toggles the mouse, F8 reloads this file.

# Keyboard
cross = space
circle = lshift
square = e
triangle = v
l1 = 1
r1 = 3
l2 = r
r2 = f
l3 = z
r3 = q
r3 = c
options = enter
pad_up = i
pad_down = k
pad_left = j
pad_right = l
touchpad_left = tab
touchpad_right = backspace

axis_left_x_minus = a
axis_left_x_plus = d
axis_left_y_minus = w
axis_left_y_plus = s
axis_right_x_minus = left
axis_right_x_plus = right
axis_right_y_minus = up
axis_right_y_plus = down

# Hold to halve the left stick (walk): uncomment and pick a key
# leftjoystick_halfmode = lalt

# Mouse (uncomment mouse_to_joystick to turn it on; buttons work only while captured)
# mouse_to_joystick = right
mouse_movement_params = 0.5, 1, 0.125
r1 = leftbutton
r2 = rightbutton
circle = sidebuttonback
square = sidebuttonforward

# Controller (Ozel Xbox Dizilimi)
# A  -> Cross (Etkilesim / Toplama)
cross = cross

# B  -> Square (Esya Kullanma)
square = circle

# X  -> R1 (Hafif Saldiri)
r1 = square

# Y  -> R2 (Guclu Saldiri)
r2 = triangle

# LB -> Circle (Yuvarlanma / Kosma)
circle = l1

# RB -> Triangle (Can Basma / Kan Sisesi)
triangle = r1

# LT -> L1 (Silah Donusturme / Trick Weapon)
l1 = l2

# RT -> L2 (Silah Atesleme / Savusturma)
l2 = r2

# LS -> L3
l3 = l3

# RS -> R3 (Hedefe Kilitlenme)
r3 = r3

# D-Pad
pad_up = pad_up
pad_down = pad_down
pad_left = pad_left
pad_right = pad_right

# Menu / View
options = options
touchpad_left = back

# Analog Sticks
axis_left_x = axis_left_x
axis_left_y = axis_left_y
axis_right_x = axis_right_x
axis_right_y = axis_right_y

# Hotkeys
hotkey_toggle_mouse_to_joystick = f7
hotkey_reload_inputs = f8
